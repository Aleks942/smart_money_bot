name: SmartMoney Telegram startup ping tests
on:
  pull_request:
    paths:
      - 'main.py'
      - 'telegram_startup_probe.py'
      - 'test_telegram_startup_probe.py'
      - '.github/workflows/telegram-startup-tests.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m py_compile main.py telegram_startup_probe.py test_telegram_startup_probe.py
      - run: python -m unittest -v test_telegram_startup_probe
