name: SmartMoney 48h deferred outcome audit
on:
  push:
    branches:
      - feature/48h-bounded-outcomes-20261012
  pull_request:
    paths:
      - horizon_audit.py
      - test_horizon_audit.py
      - rejection_forward_study.py
      - trend_confirmation.py
      - .github/workflows/horizon-audit-tests.yml
jobs:
  bounded-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m py_compile horizon_audit.py trend_confirmation.py rejection_forward_study.py
      - run: python -m unittest -v test_horizon_audit.py test_trend_confirmation.py test_rejection_forward_study.py
