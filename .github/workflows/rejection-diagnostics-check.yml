name: Signal rejection diagnostics checks
on:
  push:
    branches:
      - diagnostics/signal-rejection-20261010
  pull_request:
    paths:
      - main.py
      - .github/workflows/rejection-diagnostics-check.yml
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile main.py
